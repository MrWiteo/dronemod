plugins {
    id "java"
    id "net.neoforged.moddev" version "2.0.78"
}

version = "1.1.0"
group = "com.example.dronemod"
base { archivesName = "dronemod-neoforge" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

sourceSets.main {
    java.srcDir "../common/src/main/java"
    resources.srcDir "../common/src/main/resources"
}

neoForge {
    version = "21.1.172"
    runs {
        client { client() }
        server { server() }
    }
    mods {
        dronemod { sourceSet sourceSets.main }
    }
}
