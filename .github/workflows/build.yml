name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [neoforge, forge, fabric]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build ${{ matrix.loader }}
        working-directory: ${{ matrix.loader }}
        shell: bash
        run: |
          set +e
          gradle build --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            { grep -nE "error:|warning: \\[|What went wrong|Could not|FAILED|Caused by|Exception" -A4 build.log | head -50; echo ----TAIL----; tail -n 25 build.log; } > summary.txt
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' summary.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed (${{ matrix.loader }})::${msg}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: dronemod-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/dronemod-${{ matrix.loader }}-*.jar

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l jars
          gh release create "build-${{ github.run_number }}" jars/*.jar --title "Build ${{ github.run_number }}" --notes "Automated build: NeoForge, Forge and Fabric (Minecraft 1.21.1)"
